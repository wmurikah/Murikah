name = "murikah-tutor-container-staging"
main = "src/index.ts"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
# Production model/service variables are maintained in the Cloudflare dashboard.
# Preserve them when Workers Builds deploys the repo-backed Worker.
keep_vars = true

[observability]
enabled = true

# The Cloudflare Container Worker is now the origin for the public Tutor
# hostname. workers.dev remains enabled temporarily for direct diagnostics.
[[routes]]
pattern = "tutor.murikah.com"
custom_domain = true

# Fail closed before deployment if essential production secrets are not actually
# configured on the Worker. SSO provider secrets and Gemini fast-chat remain
# optional until enabled in the dashboard.
[secrets]
required = [
  "MURIKAH_TUTOR_ADMIN_PASSWORD",
  "MURIKAH_TUTOR_AUTH_SECRET",
  "MURIKAH_NVIDIA_NIM_API_KEY",
  "MURIKAH_DASHSCOPE_API_KEY",
  "MURIKAH_TAVILY_API_KEY",
]

# Durable Tutor state is split by storage semantics. D1 owns structured
# persistence metadata/transactional state; R2 owns private file/object state.
# Neither binding exposes an API credential to the container.
[[d1_databases]]
binding = "TUTOR_DB"
database_name = "murikah-tutor-prod"
database_id = "e8916f9a-fc2e-4bc6-925f-76c6c401c95b"

[[r2_buckets]]
binding = "TUTOR_FILES"
bucket_name = "murikah-tutor-files-prod"

[[containers]]
class_name = "TutorContainer"
image = "../Dockerfile.railway"
image_build_context = "../.."
# v18 renders ER diagrams from validated structured plans.
image_vars = { MURIKAH_CLOUDFLARE_IMAGE_REV = "2026-09-16-v18" }
# Staging keeps spare capacity for one active app, diagnostics and short-lived
# rollout overlap. max_instances is a ceiling; unused slots do not run.
max_instances = 4
instance_type = "standard-2"
rollout_active_grace_period = 0
rollout_step_percentage = [100]

[[durable_objects.bindings]]
name = "TUTOR_CONTAINER"
class_name = "TutorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TutorContainer"]

[vars]
MURIKAH_TUTOR_RUNTIME = "cloudflare-container-staging"
MURIKAH_PUBLIC_BASE_URL = "https://tutor.murikah.com"
MURIKAH_GUEST_PROMPT_LIMIT = "7"
TZ = "Africa/Nairobi"
