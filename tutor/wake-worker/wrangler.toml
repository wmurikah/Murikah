name = "murikah-tutor-wake"
main = "src/worker.js"
compatibility_date = "2026-09-11"
workers_dev = false
preview_urls = false

# Production custom domains for the always-available Tutor wake/proxy worker.
# tutor-origin.murikah.com remains the Cloudflare Tunnel origin and must not be
# attached to this Worker.
routes = [
  { pattern = "wake-test.murikah.com", custom_domain = true },
  { pattern = "tutor.murikah.com", custom_domain = true }
]

[vars]
ORIGIN_HOST = "tutor-origin.murikah.com"
CODESPACE_NAME = "glorious-yodel-x7jj5gw954h99vw"
WAKE_POLL_SECONDS = "4"
ORIGIN_HEALTH_TIMEOUT_MS = "2500"

# Secret configured in Cloudflare, never committed:
# GITHUB_CODESPACES_TOKEN
