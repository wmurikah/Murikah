name: Home hero asset and acceptance pass

on:
  push:
    branches:
      - fix/home-hero-building-reference
    paths:
      - .github/workflows/home-hero-acceptance.yml
      - src/pages/index.astro
      - src/components/Header.astro
      - src/styles/global.css

permissions:
  contents: write

jobs:
  finish-home-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Download CC0 source and build responsive hero images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/hero /tmp/home-hero-image-tools
          (
            cd /tmp/home-hero-image-tools
            npm init -y >/dev/null
            npm install --silent sharp@0.34.5
          )
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/4/40/Modern_office_building%2C_Theresienh%C3%B6he%2C_M%C3%BCnchen.jpg' \
            --output /tmp/hero-building-source.jpg

          NODE_PATH=/tmp/home-hero-image-tools/node_modules node --input-type=commonjs <<'NODE'
          const fs = require('node:fs/promises');
          const sharp = require('sharp');

          const source = '/tmp/hero-building-source.jpg';
          const dir = 'public/images/hero';
          const maxBytes = 200_000;

          async function capped(format, width, height, output, qualities) {
            for (const quality of qualities) {
              const pipeline = sharp(source)
                .rotate()
                .resize(width, height, {
                  fit: 'cover',
                  position: 'centre',
                  withoutEnlargement: false,
                });

              if (format === 'webp') {
                await pipeline.webp({ quality, effort: 6, smartSubsample: true }).toFile(output);
              } else {
                await pipeline.avif({ quality, effort: 6, chromaSubsampling: '4:2:0' }).toFile(output);
              }

              const size = (await fs.stat(output)).size;
              if (size <= maxBytes) return { quality, size };
            }
            throw new Error(`${output} exceeds ${maxBytes} bytes at minimum quality`);
          }

          async function build(width, height) {
            const suffix = String(width);
            const jpg = `${dir}/hero-building${width === 1920 ? '' : '-' + suffix}.jpg`;

            await sharp(source)
              .rotate()
              .resize(width, height, { fit: 'cover', position: 'centre' })
              .jpeg({ quality: width === 1920 ? 78 : 80, progressive: true, mozjpeg: true })
              .toFile(jpg);

            const webp = await capped(
              'webp',
              width,
              height,
              `${dir}/hero-building-${suffix}.webp`,
              [74, 70, 66, 62, 58, 54, 50, 46, 42],
            );
            const avif = await capped(
              'avif',
              width,
              height,
              `${dir}/hero-building-${suffix}.avif`,
              [58, 54, 50, 46, 42, 38, 34],
            );

            console.log(
              JSON.stringify({
                width,
                height,
                webpBytes: webp.size,
                webpQuality: webp.quality,
                avifBytes: avif.size,
                avifQuality: avif.quality,
              }),
            );
          }

          (async () => {
            await build(1920, 1200);
            await build(1280, 800);

            const fallbackMeta = await sharp(`${dir}/hero-building.jpg`).metadata();
            if (fallbackMeta.width !== 1920 || fallbackMeta.height !== 1200) {
              throw new Error('hero-building.jpg must be exactly 1920×1200');
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          cat > public/images/hero/LICENSE.md <<'EOF'
          # Homepage hero photograph

          **Photograph:** “Modern office building, Theresienhöhe, München”  
          **Author:** Robert von Oliva (naruciakk)  
          **Source:** https://commons.wikimedia.org/wiki/File:Modern_office_building,_Theresienh%C3%B6he,_M%C3%BCnchen.jpg  
          **Licence:** CC0 1.0 Universal / public-domain dedication  
          **Licence page:** https://creativecommons.org/publicdomain/zero/1.0/

          The original 5,449 × 3,625 photograph was cropped and resized for the Murikah homepage.
          The AVIF and WebP derivatives are 1920 × 1200 and 1280 × 800. No client or partner
          endorsement is implied.
          EOF

          ls -lh public/images/hero

      - name: Build production site
        run: pnpm build

      - name: Start static acceptance server
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/client/index.html ]; then
            ACCEPTANCE_ROOT=dist/client
          elif [ -f dist/index.html ]; then
            ACCEPTANCE_ROOT=dist
          else
            echo "Could not find the prerendered marketing homepage."
            find dist -maxdepth 3 -type f | head -80
            exit 1
          fi

          python3 -m http.server 4321 --bind 127.0.0.1 --directory "$ACCEPTANCE_ROOT" \
            >/tmp/murikah-preview.log 2>&1 &
          echo $! >/tmp/murikah-preview.pid

          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/murikah-preview.log
          exit 1

      - name: Install browser QA tools outside the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/home-hero-qa
          cd /tmp/home-hero-qa
          npm init -y >/dev/null
          npm install --silent @playwright/test@1.56.1 lighthouse@12.8.2
          npx playwright install chromium

      - name: Capture required viewports and run keyboard/reduced-motion checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p home-hero-qa

          cat >/tmp/home-hero-qa/home-hero.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');
          const path = require('node:path');

          const base = 'http://127.0.0.1:4321/';
          const out = process.env.GITHUB_WORKSPACE + '/home-hero-qa';

          for (const viewport of [
            { width: 1440, height: 900, name: '1440x900' },
            { width: 1024, height: 768, name: '1024x768' },
            { width: 390, height: 844, name: '390x844' },
          ]) {
            test(`hero ${viewport.name}`, async ({ page }) => {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              await page.goto(base, { waitUntil: 'networkidle' });

              const image = page.locator('.home-hero__picture img');
              await expect(image).toHaveJSProperty('complete', true);
              const naturalWidth = await image.evaluate((node) => node.naturalWidth);
              expect(naturalWidth).toBeGreaterThan(0);

              const overflow = await page.evaluate(
                () => document.documentElement.scrollWidth - window.innerWidth,
              );
              expect(overflow).toBeLessThanOrEqual(1);

              await page.screenshot({
                path: path.join(out, `hero-${viewport.name}.png`),
                fullPage: false,
              });
            });
          }

          test('keyboard order and visible hero focus rings', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto(base, { waitUntil: 'networkidle' });

            await page.keyboard.press('Tab');
            expect(await page.locator(':focus').getAttribute('class')).toContain('skip-link');

            const sequence = [];
            for (let index = 0; index < 30; index += 1) {
              const focused = page.locator(':focus');
              sequence.push(
                await focused.evaluate((node) => ({
                  text: (node.textContent || '').trim().replace(/\s+/g, ' '),
                  href: node.getAttribute('href'),
                  className: node.getAttribute('class') || '',
                })),
              );
              await page.keyboard.press('Tab');
            }

            const primary = sequence.findIndex((entry) =>
              entry.className.includes('home-hero__primary'),
            );
            const secondary = sequence.findIndex((entry) =>
              entry.className.includes('home-hero__secondary'),
            );
            expect(primary).toBeGreaterThan(-1);
            expect(secondary).toBeGreaterThan(primary);

            for (const selector of ['.home-hero__primary', '.home-hero__secondary']) {
              await page.locator(selector).focus();
              const focus = await page.locator(selector).evaluate((node) => {
                const style = getComputedStyle(node);
                return {
                  width: node.getBoundingClientRect().width,
                  height: node.getBoundingClientRect().height,
                  outlineStyle: style.outlineStyle,
                  outlineWidth: parseFloat(style.outlineWidth),
                  outlineOffset: parseFloat(style.outlineOffset),
                };
              });
              expect(focus.width).toBeGreaterThanOrEqual(44);
              expect(focus.height).toBeGreaterThanOrEqual(44);
              expect(focus.outlineStyle).not.toBe('none');
              expect(focus.outlineWidth).toBeGreaterThanOrEqual(2);
              expect(focus.outlineOffset).toBeGreaterThanOrEqual(3);
            }

            console.log('KEYBOARD_SEQUENCE=' + JSON.stringify(sequence));
          });

          test('reduced motion removes hero animation', async ({ browser }) => {
            const context = await browser.newContext({ reducedMotion: 'reduce' });
            const page = await context.newPage();
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto(base, { waitUntil: 'networkidle' });

            const states = await page.evaluate(() => ({
              headline: getComputedStyle(document.querySelector('.home-hero__headline')).animationName,
              picture: getComputedStyle(document.querySelector('.home-hero__picture')).animationName,
              image: getComputedStyle(document.querySelector('.home-hero__picture img')).animationName,
              primary: getComputedStyle(document.querySelector('.home-hero__primary')).transitionDuration,
            }));

            expect(states.headline).toBe('none');
            expect(states.picture).toBe('none');
            expect(states.image).toBe('none');
            expect(Number.parseFloat(states.primary)).toBeLessThanOrEqual(0.00001);
            console.log('REDUCED_MOTION=' + JSON.stringify(states));
            await context.close();
          });
          EOF

          cd /tmp/home-hero-qa
          npx playwright test home-hero.spec.cjs --reporter=line --workers=1

      - name: Run Lighthouse mobile acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/home-hero-qa
          node node_modules/lighthouse/cli/index.js http://127.0.0.1:4321/ \
            --quiet \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --only-categories=performance,accessibility,seo \
            --output=json \
            --output-path="$GITHUB_WORKSPACE/home-hero-qa/lighthouse-mobile.json"

          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync(process.env.GITHUB_WORKSPACE + '/home-hero-qa/lighthouse-mobile.json', 'utf8'),
          );
          const cats = report.categories;
          const lcp = report.audits['largest-contentful-paint'].numericValue;
          const cls = report.audits['cumulative-layout-shift'].numericValue;
          const summary = {
            performance: Math.round(cats.performance.score * 100),
            accessibility: Math.round(cats.accessibility.score * 100),
            seo: Math.round(cats.seo.score * 100),
            lcpMs: Math.round(lcp),
            cls: Number(cls.toFixed(4)),
          };
          console.log('LIGHTHOUSE=' + JSON.stringify(summary));
          if (lcp > 2500) {
            throw new Error(`Mobile LCP must be <= 2500ms; got ${Math.round(lcp)}ms`);
          }
          if (cls > 0.1) {
            throw new Error(`CLS must be <= 0.1; got ${cls}`);
          }
          NODE

      - name: Upload acceptance screenshots and Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: home-hero-acceptance
          path: home-hero-qa/
          retention-days: 14

      - name: Commit licensed production assets and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/home-hero-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/images/hero .github/workflows/home-hero-acceptance.yml
          git commit -m 'Add CC0 building hero image and responsive derivatives'
          git push origin HEAD:fix/home-hero-building-reference
