name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# TWO INDEPENDENT JOBS, AND THE SPLIT IS THE FIX.
#
# This used to be one job running lint, format check, build and test as
# sequential steps. Sequential steps skip everything after the first failure,
# and prettier had been red on main for days over three files nobody formatted
# — so the Build step was SKIPPED on every run, `astro check` never executed
# on any pull request, and five merges carried eleven type errors onto main
# while the deploy died at a step the pipeline had stopped reaching. Every one
# of those runs was "red", but it was the same red as yesterday's, so it read
# as noise rather than as a broken build.
#
# Now the build cannot be masked: it is its own job with its own named status
# check, and a formatting nit fails alongside it instead of in front of it.
# For a merge to be BLOCKED on these, they must also be marked as required
# status checks on the main branch (Settings → Branches → branch protection
# for main → "Require status checks to pass" → select both job names below).
# That is repository configuration, not workflow content, and only an
# administrator can set it.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version` here: package.json's `packageManager` field pins the exact
      # pnpm the lockfile was written with, and action-setup errors out when
      # both are specified rather than picking one.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm run build` is `astro check && astro build`: the type check the
      # Cloudflare deploy runs first, then the real build. This is the step
      # that proves a merge cannot break the deploy.
      - name: Build (astro check + astro build)
        run: pnpm run build

      # The unit tests plus the GRC smoke test (Build Prompt 22): the smoke
      # test boots the built worker (dist/ from the step above) against a
      # seeded throwaway database, loads every page and dry-runs every
      # mutation, and fails the build on any 500. It needs dist/, which is why
      # it lives behind the build rather than in the quality job.
      - name: Test (unit + smoke)
        run: pnpm run test

  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check
