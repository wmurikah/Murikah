name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build (astro check + astro build)
        run: pnpm run build

      # The unit tests plus the GRC smoke test (Build Prompt 22): the smoke test
      # boots the built worker (dist/ from the step above) against a seeded
      # throwaway database, loads every page and dry-runs every mutation, and
      # fails the build on any 500.
      - name: Test (unit + smoke)
        run: pnpm run test
