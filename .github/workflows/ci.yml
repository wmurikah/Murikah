name: Product CI
on:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        product: [HomeWeb, HassCMS, Engr, GRC]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.product }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.product }}/.node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.product }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
