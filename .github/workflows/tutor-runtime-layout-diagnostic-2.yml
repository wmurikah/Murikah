name: Diagnose Tutor runtime layout v2

on:
  push:
    branches:
      - fix/tutor-runtime-overlay-import-path

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DeepTutor 1.6.6 runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/hkuds/deeptutor:1.6.6"
          docker pull "$image"
          docker image inspect "$image" --format 'WorkingDir={{.Config.WorkingDir}} Env={{json .Config.Env}}'
          docker run --rm --entrypoint /bin/sh "$image" -c 'python -c '\''import os,sys,deeptutor; print("cwd=",os.getcwd()); print("sys.path=",sys.path); print("deeptutor=",deeptutor.__file__); print("/app/deeptutor=",os.path.exists("/app/deeptutor")); print("/app/src/deeptutor=",os.path.exists("/app/src/deeptutor"))'\''; find /app -maxdepth 3 -name "murikah_persistence.py" -print'
