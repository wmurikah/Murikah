name: Finalize Virtual Internship Phase 10

on:
  push:
    branches:
      - feat/tutor-virtual-internship-phase10

permissions:
  contents: write

concurrency:
  group: phase10-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase10-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
        with:
          ref: feat/tutor-virtual-internship-phase10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Phase 10 closure patch
        run: python tutor/scripts/phase10_finalize_patch.py prepare

      - name: Normalize documentation EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("tutor/virtual-internship/README.md", "tutor/cloudflare/PERSISTENCE.md"):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate all Virtual Internship scenario packs
        run: python tutor/scripts/validate_virtual_internship_scenarios.py

      - name: Run focused Phase 10 Python regressions
        run: |
          set -euo pipefail
          for test in \
            tutor/tests/test_virtual_internship_career_families.py \
            tutor/tests/test_virtual_internship_catalog.py \
            tutor/tests/test_virtual_internship_catalog_start.py \
            tutor/tests/test_virtual_internship_institution_scenarios.py \
            tutor/tests/test_virtual_internship_practice_catalog.py \
            tutor/tests/test_virtual_internship_production_packs.py \
            tutor/tests/test_virtual_internship_rubrics.py \
            tutor/tests/test_virtual_internship_scenario_schema.py \
            tutor/tests/test_virtual_internship_templates.py \
            tutor/tests/test_virtual_internship_phase10_migration.py; do
            python "$test"
          done

      - name: Validate Cloudflare persistence and packaging invariants
        run: python tutor/cloudflare/preflight.py

      - name: Validate Tutor deployment invariants
        run: python tutor/scripts/preflight.py

      - name: Close Phase 10 checklist only after gates pass
        run: |
          python tutor/scripts/phase10_finalize_patch.py finalize
          python - <<'PY'
          from pathlib import Path
          path = Path("tutor/virtual-internship/README.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Commit focused Phase 10 closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase10-finalize.yml tutor/scripts/phase10_finalize_patch.py
          git add tutor/virtual-internship/README.md \
                  tutor/cloudflare/PERSISTENCE.md \
                  tutor/cloudflare/preflight_legacy.py \
                  tutor/tests/virtual-internship-catalog.spec.tsx.txt \
                  tutor/cloudflare/migrations/0017_virtual_internship_phase10_template_retirement_fix.sql \
                  tutor/tests/test_virtual_internship_phase10_migration.py
          git commit -m 'Complete Virtual Internship Phase 10 [phase10-finalized]'
          git push origin HEAD:feat/tutor-virtual-internship-phase10
