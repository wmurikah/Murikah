name: Deploy selected product
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product directory to deploy
        required: true
        type: choice
        options: [HomeWeb, HassCMS, Engr, GRC]
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.product }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.product }}/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
