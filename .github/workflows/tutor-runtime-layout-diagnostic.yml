name: Diagnose Tutor runtime layout

on:
  push:
    branches:
      - fix/tutor-runtime-overlay-import-path

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DeepTutor 1.6.6 runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/hkuds/deeptutor:1.6.6"
          docker pull "$image"
          docker image inspect "$image" --format 'WorkingDir={{.Config.WorkingDir}} Env={{json .Config.Env}}'
          docker run --rm --entrypoint python "$image" - <<'PY'
          import os
          import sys
          import deeptutor
          print("cwd=", os.getcwd())
          print("sys.path=", sys.path)
          print("deeptutor=", deeptutor.__file__)
          try:
              import murikah_persistence
              print("murikah_persistence=", murikah_persistence.__file__)
          except Exception as exc:
              print("top_level_murikah_persistence_error=", repr(exc))
          try:
              from deeptutor import murikah_persistence as package_persistence
              print("deeptutor.murikah_persistence=", package_persistence.__file__)
          except Exception as exc:
              print("package_murikah_persistence_error=", repr(exc))
          for path in ("/app", "/app/src", "/app/deeptutor", "/app/src/deeptutor"):
              print(path, "exists=", os.path.exists(path))
          PY
