name: Build Murikah Tutor image

on:
  push:
    paths:
      - "tutor/**"
      - "docs/images/murikah_6.png"
      - ".github/workflows/tutor-image.yml"
  pull_request:
    paths:
      - "tutor/**"
      - "docs/images/murikah_6.png"
      - ".github/workflows/tutor-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tutor-image-${{ github.ref }}
  # Never cancel an in-flight main release after it has started publishing.
  # Pull-request validation remains replaceable by newer commits.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Tutor deployment invariants
        env:
          MURIKAH_TUTOR_BASE_REF: origin/main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python tutor/scripts/preflight.py
          python tutor/cloudflare/preflight.py

      - name: Validate Cloudflare Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tutor/cloudflare --no-audit --no-fund
          npm --prefix tutor/cloudflare run check

      - name: Compute Tutor source revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          tutor_tree="$(git rev-parse HEAD:tutor)"
          logo_blob="$(git rev-parse HEAD:docs/images/murikah_6.png)"
          source_revision="${tutor_tree}-${logo_blob}"
          echo "value=${source_revision}" >> "$GITHUB_OUTPUT"
          echo "Tutor source revision: ${source_revision}"

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build pinned Tutor image
        env:
          SOURCE_REVISION: ${{ steps.revision.outputs.value }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/murikah-tutor
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "MURIKAH_CLOUDFLARE_IMAGE_REV=${SOURCE_REVISION}" \
            --label "com.murikah.tutor.source-revision=${SOURCE_REVISION}" \
            --file tutor/Dockerfile.railway \
            --tag "${IMAGE}:source-${SOURCE_REVISION}" \
            .
          actual_revision="$(docker image inspect -f '{{ index .Config.Labels "com.murikah.tutor.source-revision" }}' "${IMAGE}:source-${SOURCE_REVISION}")"
          test "$actual_revision" = "$SOURCE_REVISION"

      - name: Publish immutable source image
        if: github.event_name != 'pull_request'
        env:
          SOURCE_REVISION: ${{ steps.revision.outputs.value }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/murikah-tutor
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:source-${SOURCE_REVISION}"

      - name: Publish immutable image to Cloudflare Registry
        if: github.ref == 'refs/heads/main'
        env:
          SOURCE_REVISION: ${{ steps.revision.outputs.value }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/murikah-tutor
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cf_source="murikah-tutor:source-${SOURCE_REVISION}"
          docker tag "${IMAGE}:source-${SOURCE_REVISION}" "${cf_source}"
          tutor/cloudflare/node_modules/.bin/wrangler containers push "${cf_source}" --config tutor/cloudflare/wrangler.toml

      - name: Deploy and verify exact Tutor release
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MURIKAH_TUTOR_RELEASE_OWNER: github-actions
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tutor/cloudflare run deploy:release
          npm --prefix tutor/cloudflare run smoke:staging

      - name: Advance last-known-good aliases
        if: github.ref == 'refs/heads/main'
        env:
          SOURCE_REVISION: ${{ steps.revision.outputs.value }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/murikah-tutor
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cf_main="murikah-tutor:main"
          docker tag "${IMAGE}:source-${SOURCE_REVISION}" "${cf_main}"
          tutor/cloudflare/node_modules/.bin/wrangler containers push "${cf_main}" --config tutor/cloudflare/wrangler.toml
          docker tag "${IMAGE}:source-${SOURCE_REVISION}" "${IMAGE}:main"
          docker push "${IMAGE}:main"
