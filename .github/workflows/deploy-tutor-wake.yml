name: Deploy Murikah Tutor Wake Worker

# Dedicated deployment for the always-available Tutor ingress worker.
on:
  push:
    branches: [main]
    paths:
      - "tutor/wake-worker/**"
      - ".github/workflows/deploy-tutor-wake.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-murikah-tutor-wake
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Tutor wake worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wake worker dependencies
        working-directory: tutor/wake-worker
        run: npm install --no-audit --no-fund

      - name: Deploy with Wrangler
        working-directory: tutor/wake-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
