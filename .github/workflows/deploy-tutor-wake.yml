name: Deploy Murikah Tutor Wake Worker

on:
  push:
    branches: [main]
    paths:
      - "Tutor/wake-worker/**"
      - ".github/workflows/deploy-tutor-wake.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-murikah-tutor-wake
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Tutor wake worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install wake worker dependencies
        working-directory: Tutor/wake-worker
        run: npm ci --no-audit --no-fund

      - name: Deploy with Wrangler
        working-directory: Tutor/wake-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
