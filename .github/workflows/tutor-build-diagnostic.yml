name: Diagnose Tutor image build

on:
  push:
    branches:
      - fix/tutor-runtime-overlay-import-path

permissions:
  contents: read

jobs:
  diagnose-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build pinned Tutor image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain \
            -f tutor/Dockerfile.railway \
            --build-arg DEEPTUTOR_COMMIT=7a96bba1ae03401644c17763a2411c28aff3dcc9 \
            -t murikah-tutor:diagnostic \
            .

      - name: Verify packaged Tutor modules use package imports
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python murikah-tutor:diagnostic -c '
          import importlib
          modules = (
              "deeptutor.murikah_persistence",
              "deeptutor.murikah_access",
              "deeptutor.murikah_personalization",
              "deeptutor.api.routers.murikah_guest",
              "deeptutor.api.routers.murikah_virtual_internship",
              "deeptutor.api.routers.murikah_virtual_internship_admin",
              "deeptutor.virtual_internship",
          )
          for name in modules:
              module = importlib.import_module(name)
              path = getattr(module, "__file__", "") or ""
              assert path.startswith("/app/deeptutor/"), (name, path)
              print(f"OK {name} -> {path}")
          '
